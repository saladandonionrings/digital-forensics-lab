<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Forensics Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'Fira Code', monospace; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .active-lab {
            background: linear-gradient(90deg, rgba(34, 197, 94, 0.15) 0%, rgba(34, 197, 94, 0) 100%);
            border-left: 3px solid #22c55e;
            color: #22c55e;
            box-shadow: inset 10px 0 20px -10px rgba(34, 197, 94, 0.2);
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* Themed Scanline Animation */
        .scanline {
            width: 100%;
            height: 10px;
            z-index: 10;
            background: linear-gradient(to bottom, transparent, rgba(34, 197, 94, 0.1), transparent);
            position: absolute;
            left: 0;
            pointer-events: none;
            animation: scan 6s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }

        .terminal-text {
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #22c55e;
            animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #22c55e; } }
    </style>
</head>
<body class="bg-[#0b1120] text-slate-300 flex h-screen overflow-hidden">

    <nav class="w-72 bg-[#10192c] border-r border-slate-800/60 flex flex-col shadow-2xl z-20">
        <div class="p-8">
            <div class="flex items-center gap-2 mb-1">
                <span class="flex h-2 w-2 rounded-full bg-green-500 animate-pulse"></span>
                <h1 class="text-[10px] font-black tracking-[0.2em] text-green-500 uppercase">System Active</h1>
            </div>
            <p class="text-xl font-bold text-white tracking-tight">Forensics<span class="text-slate-500 font-light">Lab</span></p>
        </div>
        
        <div id="lab-menu" class="flex-grow overflow-y-auto px-3 space-y-1">
            <div class="px-5 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Available Modules</div>
        </div>

        <div class="mx-4 mb-4 p-3 bg-black/40 rounded-lg border border-slate-800/50">
            <div class="text-[9px] mono text-green-500/70 space-y-1">
                <p>> SYS_STATUS: OPTIMAL</p>
                <p>> NETWORK_LISTENING...</p>
                <p id="live-log" class="text-green-400">waiting for input_</p>
            </div>
        </div>

        <div class="p-6 border-t border-slate-800 bg-slate-900/40">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Progress</span>
                <span id="total-score" class="text-xs font-bold text-green-500 mono">0%</span>
            </div>
            <div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-green-500 h-full transition-all duration-1000 shadow-[0_0_8px_rgba(34,197,94,0.6)]" style="width: 0%"></div>
            </div>
        </div>
    </nav>

    <main class="relative flex-grow overflow-y-auto bg-[radial-gradient(circle_at_top_right,_#1e293b_0%,_#0f172a_50%,_#0b1120_100%)]">
        <div class="scanline"></div>
        
        <div id="lab-content" class="max-w-5xl mx-auto p-12 relative z-10">
            <div class="text-center py-32 animate-fadeIn">
                <div class="inline-block p-4 rounded-3xl bg-slate-800/30 mb-8 border border-slate-700/50 backdrop-blur-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17" />
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-white mb-3 tracking-tight">Initialize Investigation</h2>
                <p class="text-slate-500 max-w-sm mx-auto leading-relaxed">Please select a case module from the sidebar to begin data extraction and artifact analysis.</p>
            </div>
        </div>
    </main>

    <script>
        let allData = [];
        let solvedChallenges = new Map();
        const STORAGE_KEY = 'forensics_lab_progress';

        async function init() {
            loadProgress();
            try {
                const res = await fetch('http://127.0.0.1:8000/labs');
                allData = await res.json();
                renderMenu();
                updateProgress(); 
                logTerminal("API connection established.");
            } catch (err) {
                document.getElementById('lab-menu').innerHTML = '<div class="px-5 text-red-500 text-[10px] mono mt-4">!! API_OFFLINE !!</div>';
                logTerminal("CRITICAL: API Connection Failed.");
            }
        }

        function logTerminal(msg) {
            const el = document.getElementById('live-log');
            if(el) el.innerText = `> ${msg.toUpperCase()}`;
        }

        function saveProgress() {
            const obj = Object.fromEntries(solvedChallenges);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
        }

        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const obj = JSON.parse(saved);
                    solvedChallenges = new Map(Object.entries(obj));
                } catch (e) { console.error(e); }
            }
        }

        function renderMenu() {
            const menu = document.getElementById('lab-menu');
            menu.innerHTML = '<div class="px-5 py-3 text-[10px] font-bold text-slate-500 uppercase tracking-widest">Available Modules</div>';
            
            allData.forEach((lab) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-5 py-3 rounded-xl hover:bg-slate-800/40 transition-all duration-300 text-sm font-medium text-slate-400 hover:text-white flex items-center justify-between group mb-1";
                btn.id = `nav-btn-${lab.id}`;

                const labSolvedCount = lab.challenges.filter(c => solvedChallenges.has(c.id)).length;
                const isFullySolved = lab.challenges.length > 0 && labSolvedCount === lab.challenges.length;

                btn.innerHTML = `
                    <span class="${isFullySolved ? 'text-green-500' : ''}">${lab.title}</span>
                    <div class="flex items-center gap-2">
                        ${isFullySolved ? '<span class="text-[9px] bg-green-500/10 text-green-500 border border-green-500/20 px-1.5 py-0.5 rounded-md font-bold">SOLVED</span>' : ''}
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </div>
                `;
                btn.onclick = () => {
                    showLab(lab.id);
                    logTerminal(`accessing: ${lab.title}`);
                };
                menu.appendChild(btn);
            });
        }

        function showLab(labId) {
            document.querySelectorAll('#lab-menu button').forEach(b => b.classList.remove('active-lab', 'text-white'));
            const activeBtn = document.getElementById(`nav-btn-${labId}`);
            if(activeBtn) activeBtn.classList.add('active-lab', 'text-white');

            const lab = allData.find(l => l.id === labId);
            const container = document.getElementById('lab-content');

            const downloadHtml = lab.download_url ? `
                <div class="glass-card p-8 rounded-3xl mb-12 flex flex-col md:flex-row justify-between items-center gap-6 border-t border-blue-500/20">
                    <div class="flex items-center gap-5">
                        <div class="bg-blue-500/10 p-4 rounded-2xl border border-blue-500/20">
                            <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                        </div>
                        <div>
                            <h3 class="text-white font-bold text-xl mb-1 tracking-tight">Case Evidence</h3>
                            <p class="text-slate-400 text-sm mono">HASH_SHA256: VALIDATED</p>
                        </div>
                    </div>
                    <a href="${lab.download_url}" download class="whitespace-nowrap bg-blue-600 hover:bg-blue-500 hover:scale-105 text-white px-10 py-4 rounded-2xl font-bold transition-all shadow-xl shadow-blue-900/20 flex items-center gap-3">
                        Download Artifacts
                    </a>
                </div>
            ` : '';

            let challengesHtml = lab.challenges.map(c => {
                const isSolved = solvedChallenges.has(c.id);
                const savedValue = isSolved ? solvedChallenges.get(c.id) : '';
                
                return `
                <div class="glass-card p-8 rounded-3xl mb-6 transition-all duration-500 ${isSolved ? 'border-green-500/20 bg-green-500/[0.02]' : 'hover:border-slate-600'}">
                    <div class="flex justify-between items-start mb-6">
                        <div class="max-w-2xl">
                            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3 block mono px-2 py-0.5 bg-slate-800/50 w-max rounded">UID: ${c.id}</span>
                            <p class="text-lg font-medium text-white leading-relaxed tracking-tight">${c.question}</p>
                        </div>
                        <div class="text-right">
                            <span class="bg-slate-900/80 text-slate-400 text-[10px] font-bold px-4 py-2 rounded-xl border border-slate-700/50 mono shadow-inner">${c.points} XP</span>
                        </div>
                    </div>
                    <div class="flex gap-4">
                        <input id="input-${c.id}" 
                               ${isSolved ? 'disabled' : ''}
                               value="${savedValue}"
                               class="bg-black/20 border border-slate-700 text-white px-5 py-4 rounded-2xl flex-grow outline-none focus:border-green-500/50 transition-all mono text-sm ${isSolved ? 'border-green-500/30 text-green-500' : ''}" 
                               placeholder="Enter evidence string...">
                        <button onclick="check('${c.id}')" 
                                ${isSolved ? 'disabled' : ''}
                                class="${isSolved ? 'bg-slate-800 text-slate-500' : 'bg-green-600 hover:bg-green-500 hover:shadow-[0_0_20px_rgba(34,197,94,0.3)] text-white'} px-10 py-4 rounded-2xl font-bold transition-all text-xs uppercase tracking-widest">
                            ${isSolved ? 'Verified' : 'Verify'}
                        </button>
                    </div>
                    <p id="msg-${c.id}" class="mt-5 text-[10px] font-bold mono uppercase tracking-widest flex items-center gap-2">
                        ${isSolved ? '<span class="h-1 w-1 bg-green-500 rounded-full"></span> [ DATA_MATCH_CONFIRMED ]' : ''}
                    </p>
                </div>
            `}).join('');

            container.innerHTML = `
                <div class="animate-fadeIn">
                    <header class="mb-12">
                        <div class="flex items-center gap-3 mb-6">
                            <span class="h-px w-12 bg-green-500/50"></span>
                            <span class="text-[10px] font-bold text-green-500 uppercase tracking-[0.3em] mono italic">Forensic Analysis Report</span>
                        </div>
                        <h2 class="text-6xl font-black text-white mb-6 tracking-tighter">${lab.title}</h2>
                        <p class="text-slate-400 text-xl max-w-3xl font-light leading-relaxed">${lab.description}</p>
                    </header>
                    ${downloadHtml}
                    <div class="space-y-4">${challengesHtml}</div>
                </div>
            `;
        }

        async function check(challengeId) {
            const inputField = document.getElementById(`input-${challengeId}`);
            const button = inputField.nextElementSibling;
            const attempt = inputField.value;
            
            if (inputField.disabled || !attempt.trim()) return;

            button.innerText = "Processing...";
            logTerminal(`Validating: ${challengeId}`);

            try {
                const res = await fetch('http://127.0.0.1:8000/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({challenge_id: challengeId, attempt: attempt})
                });
                
                const data = await res.json();
                const msg = document.getElementById(`msg-${challengeId}`);

                if(data.status === "correct") {
                    solvedChallenges.set(challengeId, attempt);
                    saveProgress();
                    updateProgress();
                    renderMenu(); 
                    logTerminal("Flag verified: Status 200");

                    msg.innerHTML = '<span class="h-1 w-1 bg-green-500 rounded-full"></span> [ DATA_MATCH_CONFIRMED ]';
                    msg.className = "mt-5 text-[10px] font-bold mono text-green-400 uppercase tracking-widest flex items-center gap-2";
                    inputField.disabled = true;
                    inputField.classList.add('border-green-500/30', 'text-green-500');
                    button.disabled = true;
                    button.innerText = "Verified";
                    button.className = "bg-slate-800 text-slate-500 px-10 py-4 rounded-2xl font-bold text-xs uppercase";
                } else {
                    logTerminal("Error: Checksum mismatch");
                    msg.innerText = "[ !! ] DATA_MISMATCH_ERROR";
                    msg.className = "mt-5 text-[10px] font-bold mono text-red-500 uppercase tracking-widest";
                    inputField.classList.add('border-red-500/50');
                    setTimeout(() => {
                        inputField.classList.remove('border-red-500/50');
                        button.innerText = "Verify";
                    }, 1000);
                }
            } catch (e) {
                button.innerText = "Timeout";
                logTerminal("Error: Connection timeout");
            }
        }

        function updateProgress() {
            if (!allData || allData.length === 0) return;
            const total = allData.reduce((acc, lab) => acc + (lab.challenges ? lab.challenges.length : 0), 0);
            const current = solvedChallenges.size;
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            
            document.getElementById('total-score').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        init();
    </script>
</body>
</html>
