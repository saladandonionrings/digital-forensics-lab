<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Forensics Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'Fira Code', monospace; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .active-lab {
            background: linear-gradient(90deg, rgba(34, 197, 94, 0.1) 0%, rgba(34, 197, 94, 0) 100%);
            border-left: 3px solid #22c55e;
            color: #22c55e;
        }
        
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-300 flex h-screen overflow-hidden">

    <nav class="w-72 bg-[#1e293b]/50 border-r border-slate-800 flex flex-col shadow-2xl">
        <div class="p-8">
            <h1 class="text-xs font-black tracking-widest text-green-500 uppercase mb-1">Internal Systems</h1>
            <p class="text-xl font-bold text-white tracking-tight">Forensics<span class="text-slate-500 font-light">Lab</span></p>
        </div>
        
        <div id="lab-menu" class="flex-grow overflow-y-auto px-3 space-y-1">
            <div class="px-5 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Available Modules</div>
        </div>

        <div class="p-6 border-t border-slate-800 bg-slate-900/50">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-medium text-slate-400">Overall Progress</span>
                <span id="total-score" class="text-xs font-bold text-green-500 mono">0%</span>
            </div>
            <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-green-500 h-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </nav>

    <main class="flex-grow overflow-y-auto bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-[#0f172a] to-[#0f172a]">
        <div id="lab-content" class="max-w-5xl mx-auto p-12">
            <div class="text-center py-32">
                <div class="inline-block p-3 rounded-2xl bg-slate-800/50 mb-6 border border-slate-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2 tracking-tight">System Ready for Analysis</h2>
                <p class="text-slate-500 max-w-sm mx-auto">Select a workstation or log file from the left panel to begin your digital forensic investigation.</p>
            </div>
        </div>
    </main>

    <script>
        let allData = [];
        let solvedChallenges = new Map(); // Store ID and the specific correct answer

        async function init() {
            try {
                const res = await fetch('http://127.0.0.1:8000/labs');
                allData = await res.json();
                renderMenu();
            } catch (err) {
                document.getElementById('lab-menu').innerHTML = '<div class="px-5 text-red-400 text-xs mono mt-4">ERROR: UNABLE TO CONNECT TO API</div>';
            }
        }

        function renderMenu() {
            const menu = document.getElementById('lab-menu');
            allData.forEach((lab) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-5 py-3 rounded-lg hover:bg-slate-800/50 transition-all duration-200 text-sm font-medium text-slate-400 hover:text-white flex items-center justify-between group";
                btn.id = `nav-btn-${lab.id}`;
                btn.innerHTML = `
                    <span>${lab.title}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                `;
                btn.onclick = () => showLab(lab.id);
                menu.appendChild(btn);
            });
        }

        function showLab(labId) {
            document.querySelectorAll('#lab-menu button').forEach(b => b.classList.remove('active-lab', 'text-white'));
            const activeBtn = document.getElementById(`nav-btn-${labId}`);
            activeBtn.classList.add('active-lab', 'text-white');

            const lab = allData.find(l => l.id === labId);
            const container = document.getElementById('lab-content');

            const downloadHtml = lab.download_url ? `
                <div class="glass-card p-8 rounded-2xl mb-12 flex flex-col md:flex-row justify-between items-center gap-6 border-l-4 border-l-blue-500">
                    <div>
                        <h3 class="text-white font-bold text-xl mb-1 flex items-center gap-2 tracking-tight">
                            Lab files
                        </h3>
                        <p class="text-slate-400 text-sm">Download</p>
                    </div>
                    <a href="${lab.download_url}" download class="whitespace-nowrap bg-blue-600 hover:bg-blue-500 text-white px-8 py-3.5 rounded-xl font-bold transition-all shadow-lg shadow-blue-900/40 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                    </a>
                </div>
            ` : '';

            let challengesHtml = lab.challenges.map(c => {
                const isSolved = solvedChallenges.has(c.id);
                const savedValue = isSolved ? solvedChallenges.get(c.id) : '';
                
                return `
                <div class="glass-card p-8 rounded-2xl mb-6 transition-all duration-300 ${isSolved ? 'border-green-500/30' : ''}">
                    <div class="flex justify-between items-start mb-6">
                        <div class="max-w-2xl">
                            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block mono">id : ${c.id}</span>
                            <p class="text-lg font-medium text-white leading-relaxed tracking-tight">${c.question}</p>
                        </div>
                        <div class="text-right">
                            <span class="bg-slate-800 text-slate-400 text-[10px] font-bold px-3 py-1.5 rounded-md border border-slate-700 mono">${c.points} PTS</span>
                        </div>
                    </div>
                    <div class="flex gap-3">
                        <input id="input-${c.id}" 
                               ${isSolved ? 'disabled' : ''}
                               value="${savedValue}"
                               class="bg-[#0f172a] border border-slate-700 text-white p-4 rounded-xl flex-grow outline-none focus:border-green-500/50 transition-all mono text-sm" 
                               placeholder="Answer...">
                        <button onclick="check('${c.id}')" 
                                ${isSolved ? 'disabled' : ''}
                                class="${isSolved ? 'bg-slate-800 text-slate-500' : 'bg-green-600 hover:bg-green-500 text-white'} px-8 py-4 rounded-xl font-bold transition-all text-sm uppercase tracking-wider">
                            ${isSolved ? 'Solved' : 'Verify'}
                        </button>
                    </div>
                    <p id="msg-${c.id}" class="mt-4 text-[10px] font-bold mono uppercase tracking-widest ${isSolved ? 'text-green-400' : ''}">
                        ${isSolved ? '> CORRECT' : ''}
                    </p>
                </div>
            `}).join('');

            container.innerHTML = `
                <div class="animate-fadeIn">
                    <header class="mb-12">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="h-px w-8 bg-green-500"></span>
                            <span class="text-xs font-bold text-green-500 uppercase tracking-widest mono italic">Incident Analysis Report</span>
                        </div>
                        <h2 class="text-5xl font-extrabold text-white mb-4 tracking-tighter">${lab.title}</h2>
                        <p class="text-slate-400 text-lg max-w-2xl font-light">${lab.description}</p>
                    </header>
                    
                    ${downloadHtml}

                    <div class="space-y-4">
                        ${challengesHtml}
                    </div>
                </div>
            `;
        }

        async function check(challengeId) {
            const inputField = document.getElementById(`input-${challengeId}`);
            const button = inputField.nextElementSibling;
            const attempt = inputField.value;
            
            if (inputField.disabled || !attempt.trim()) return;

            button.innerText = "Verifying...";
            button.classList.add('opacity-50');

            try {
                const res = await fetch('http://127.0.0.1:8000/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({challenge_id: challengeId, attempt: attempt})
                });
                
                const data = await res.json();
                const msg = document.getElementById(`msg-${challengeId}`);
                
                button.classList.remove('opacity-50');

                if(data.status === "correct") {
                    solvedChallenges.set(challengeId, attempt);
                    msg.innerText = "> CORRECT";
                    msg.className = "mt-4 text-[10px] font-bold mono text-green-400 uppercase tracking-widest";
                    
                    inputField.disabled = true;
                    inputField.classList.add('bg-green-500/5', 'border-green-500/50', 'text-green-500');
                    
                    button.disabled = true;
                    button.innerText = "Solved";
                    button.className = "bg-slate-800 text-slate-500 px-8 py-4 rounded-xl font-bold cursor-not-allowed text-sm uppercase";
                    
                    updateProgress();
                } else {
                    msg.innerText = "> INCORRECT";
                    msg.className = "mt-4 text-[10px] font-bold mono text-red-400 uppercase tracking-widest";
                    inputField.classList.add('border-red-500/50');
                    setTimeout(() => {
                        inputField.classList.remove('border-red-500/50');
                        button.innerText = "Verify";
                    }, 1000);
                }
            } catch (e) {
                button.innerText = "Error";
            }
        }

        function updateProgress() {
            const total = allData.reduce((acc, lab) => acc + lab.challenges.length, 0);
            const current = solvedChallenges.size;
            const percent = total > 0 ? Math.round((current / total) * 100) : 0;
            
            document.getElementById('total-score').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

        init();
    </script>
</body>
</html>
